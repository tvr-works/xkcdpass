name: Distribution

run-name: Distribution ${{ inputs.operation }} for ${{ github.ref_name }} at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Distribution operation
        required: true
        default: build
        type: choice
        options:
          - build
          - release
      version:
        description: v-prefixed Semantic Version (required for release; ignored for build)
        required: false
        type: string

permissions:
  contents: read

jobs:
  request:
    name: Validate distribution request
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      version: ${{ steps.distribution.outputs.version }}
      artifact_name: ${{ steps.distribution.outputs.artifact_name }}

    steps:
      - name: Validate distribution source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OPERATION: ${{ inputs.operation }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "${OPERATION}" == "release" && "${REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "releases must be dispatched from the default branch (${DEFAULT_BRANCH})" >&2
            exit 1
          fi
          if [[ "${OPERATION}" != "build" && "${OPERATION}" != "release" ]]; then
            echo "unsupported distribution operation: ${OPERATION}" >&2
            exit 1
          fi

      - name: Check out selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate distribution request
        id: distribution
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/release-version.sh
          source ./scripts/release-version.sh

          if [[ "${OPERATION}" == "build" ]]; then
            version="dev-${SHA}"
          elif [[ "${OPERATION}" == "release" ]]; then
            validate_release_version "${RELEASE_VERSION}"
            version="${RELEASE_VERSION}"
          else
            echo "unsupported distribution operation: ${OPERATION}" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "goreleaser_version=${version#v}"
            echo "artifact_name=xkcdpass_${version}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Verify distribution
    needs: request
    uses: ./.github/workflows/verification.yml
    with:
      artifact_version: ${{ needs.request.outputs.version }}

  publish:
    name: Publish GitHub release
    if: inputs.operation == 'release'
    needs: [request, build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    concurrency:
      group: xkcdpass-release-${{ needs.request.outputs.version }}
      queue: max

    steps:
      - name: Check out release automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Reconcile draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.request.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: ./.github/scripts/publish-release.sh "${RELEASE_VERSION}" "${TARGET_SHA}" "dist"
